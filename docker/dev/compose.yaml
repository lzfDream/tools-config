name: dev

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - type: bind
        source: ../test/mysql
        target: /var/lib/mysql
    #   - type: bind
    #     source: ./mysql.cnf
    #     target: /etc/mysql/conf.d/my.cnf
    # command: sh -c "chmod 644 /etc/mysql/conf.d/my.cnf && /entrypoint.sh mysqld"
    # profiles: ["mysql"]

  redis:
    image: redis:7.4.0
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - type: bind
        source: ../test/redis
        target: /data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # profiles: ["redis"]
